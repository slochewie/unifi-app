name: Update shared package lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out unifi-app
        uses: actions/checkout@v4

      - name: Check out niteowl-ui
        uses: actions/checkout@v4
        with:
          repository: slochewie/niteowl-ui
          path: app/packages/niteowl-ui

      - name: Check out niteowl-app-config
        uses: actions/checkout@v4
        with:
          repository: slochewie/niteowl-app-config
          path: app/packages/niteowl-app-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Regenerate lockfile
        working-directory: app
        run: npm install --package-lock-only --include=dev --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- app/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          git commit -m "Update shared package lockfile"
          git push
